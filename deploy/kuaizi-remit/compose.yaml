name: kuaizi-remit

x-application: &application
  image: kuaizi-remit-php:${RELEASE_ID:?RELEASE_ID is required}
  env_file: /opt/kuaizi-remit/config/app.env
  restart: unless-stopped
  init: true
  volumes:
    - /opt/kuaizi-remit/data/storage:/srv/app/storage
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: '5'
  mem_limit: 768m
  cpus: 0.75
  networks: [application]

services:
  database:
    image: mysql:8.4
    env_file: /opt/kuaizi-remit/config/database.env
    restart: unless-stopped
    volumes:
      - /opt/kuaizi-remit/data/mysql:/var/lib/mysql
    command: [--innodb-buffer-pool-size=512M, --max-connections=100]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: local
      options: {max-size: 20m, max-file: '5'}
    networks: [application]

  api:
    <<: *application
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, 'exit(is_resource(@fsockopen("127.0.0.1", 9000)) ? 0 : 1);']
      interval: 10s
      timeout: 5s
      retries: 12

  reverb:
    <<: *application
    command: [php, artisan, 'reverb:start', '--host=0.0.0.0', '--port=8080']
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.25

  queue:
    <<: *application
    command: [php, artisan, 'queue:work', '--queue=member-push,default', '--sleep=3', '--tries=3', '--timeout=60', '--max-time=3600']
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.25

  scheduler:
    <<: *application
    command: [php, artisan, 'schedule:work', '--no-interaction']
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.25

  web:
    image: kuaizi-remit-web:${RELEASE_ID:?RELEASE_ID is required}
    restart: unless-stopped
    ports: ['127.0.0.1:8688:8080', '127.0.0.1:8689:8081']
    volumes:
      - /opt/kuaizi-remit/config/web.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/kuaizi-remit/config/release.json:/srv/release.json:ro
      - /opt/kuaizi-remit/data/storage:/srv/app/storage:ro
      - /opt/kuaizi-remit/releases/${RELEASE_ID}/admin-dist:/srv/admin:ro
    depends_on:
      api: {condition: service_healthy}
      reverb: {condition: service_started}
    mem_limit: 192m
    cpus: 0.25
    logging:
      driver: local
      options: {max-size: 20m, max-file: '5'}
    networks: [application]

networks:
  application:
    name: kuaizi-remit-application
